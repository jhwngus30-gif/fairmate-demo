<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FairMate 체험판</title>
<meta name="description" content="KITA 무역 AX 과정 팀 프로젝트 FairMate의 실제 서비스 화면을 시연용 가상 데이터로 둘러보는 체험판">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 위 안내 띠 + 머리말, 아래는 왼쪽 화면 목록(메뉴별 묶음)과 오른쪽 실제 화면 캡처. FairMate 실제 서비스의 주황 브랜드 색을 따른다. */
:root{
  --bg:#f6f4f1; --panel:#ffffff; --fg:#1f2430; --muted:#6a6f7b; --line:#e7e2db;
  --accent:#e8590c; --accent-soft:#fdeee4; --on:#ffffff;
  --band:#2b2622; --band-fg:#f6efe8;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16130f; --panel:#221d18; --fg:#efe9e2; --muted:#a69d93; --line:#3a332b;
  --accent:#ff8a3d; --accent-soft:#3b2616; --on:#16130f; --band:#0d0b09; --band-fg:#e9e1d8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16130f; --panel:#221d18; --fg:#efe9e2; --muted:#a69d93; --line:#3a332b;
  --accent:#ff8a3d; --accent-soft:#3b2616; --on:#16130f; --band:#0d0b09; --band-fg:#e9e1d8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.band{background:var(--band);color:var(--band-fg);font-size:12.5px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band p{max-width:1500px;margin:0 auto}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
header h1{margin:0;font-size:21px;font-weight:700;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
nav{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;
  position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow-y:auto}
nav h2{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:14px 8px 4px}
nav h2:first-child{margin-top:2px}
nav button{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;text-align:left;border:0;background:none;
  color:var(--fg);font:inherit;font-size:13.5px;padding:6px 8px;border-radius:8px;cursor:pointer}
nav button:hover{background:var(--accent-soft)}
nav button[aria-current="true"]{background:var(--accent);color:var(--on);font-weight:500}
nav button:focus-visible,.step button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.me{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
nav button[aria-current="true"] .me{background:var(--on);color:var(--accent)}
main{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px 20px;min-width:0;display:flex;flex-direction:column;gap:12px}
.cap{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.cap h3{margin:0;font-size:18px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cap .desc{margin:0;color:var(--muted);font-size:13.5px;flex-basis:100%;max-width:75ch}
.cap .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:8px}
.step button{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;font-size:13px;border-radius:8px;padding:4px 12px;cursor:pointer}
.step button:hover{border-color:var(--accent);color:var(--accent)}
.shot{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.shot img{display:block;width:100%;height:auto}
.note{margin:0;font-size:12.5px;color:var(--muted)}
@media (max-width:860px){.app{grid-template-columns:1fr}nav{position:static;max-height:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="band"><p>체험용 화면 · KITA 무역 AX 과정 팀 프로젝트 FairMate · 실제 서비스는 로그인과 유료 AI 기능이 필요해 따로 운영합니다</p></div>
<div class="wrap">
  <header>
    <div>
      <h1>FairMate 해외 박람회 준비 대시보드 · 체험판</h1>
      <p>팀 삼조상조 5명 · 2026.09.17~09.29 · 시연 시나리오: 찹쌀 고추장(HS 2103.90)으로 미국 Summer Fancy Food Show 참가 준비 · 왼쪽에서 화면을 고르세요</p>
    </div>
  </header>
  <div class="app">
    <nav id="nav" aria-label="화면 목록"></nav>
    <main id="view" aria-live="polite"></main>
  </div>
</div>

<script>
const S=[
 ['대시보드','dashboard','박람회 지도','세계 지도에서 권역을 누르면 그 대륙의 박람회 목록으로 이동합니다. 수집·분류한 해외 박람회 816건을 권역별로 셉니다.'],
 ['대시보드','expo-list','해외 박람회 목록','식품 여부·규모·참관 대상·키워드·기간 조건으로 참가 후보를 좁힙니다.'],
 ['대시보드','chatbot','챗봇 도우미','사이트 이용 안내와 HS코드·박람회·관세율 질문에 답합니다. 실제 서비스에서는 AI가 DB를 직접 조회해 답하고, 체험판에는 열린 화면만 담았습니다.'],
 ['박람회 상세','expo-overview','박람회 개요','개최지, 일정, 규모, 참관 대상, 공식 웹사이트, 연관 키워드와 한국어 소개를 한 화면에 모았습니다.'],
 ['박람회 상세','market-tab','시장 개요','"지금 조사하기"를 누르면 UN Comtrade·관세청 통계와 AI 분석으로 개최국 수입 순위·점유율·추이와 전략 시사점을 정리합니다. 체험판에는 실행 전 화면을 담았습니다.'],
 ['박람회 상세','tariff','관세 & 수출 주의사항','찹쌀 고추장(HS 2103.90) → 미국: MFN 기본세율과 한-미 FTA 세율을 비교해 0%인 FTA를 최적 관세로 추천하고, 필요 인증(FDA·HACCP)을 보여 줍니다. 관세율은 실제 데이터입니다.'],
 ['박람회 상세','tariff-regulations','수출 주의사항 목록','미국 FDA 수입규정을 필수·주의·정보로 나누고 규제 강도를 표시합니다. 규정 6건은 시연용 예시 데이터입니다.'],
 ['박람회 상세','trend-tab','트렌드 조사','제품·국가·박람회 정보가 자동으로 채워진 입력 화면입니다. "분석 실행"을 누르면 현지 검색어 4단계(유입·구매·비교·활용), 경쟁 제품 소매가, 현지 시장 트렌드를 조사합니다.'],
 ['기획','market-matrix','품목별 유망시장','HS코드를 넣고 "통합분석"을 누르면 수입 성장률 × 한국 점유율 매트릭스와 AI 분석으로 우선 공략 국가를 고릅니다. 체험판에는 실행 전 화면을 담았습니다.'],
 ['기획','booth','부스 컨셉 기획','"컨셉 자동 생성하기"를 누르면 조사 근거로 부스 테마·슬로건, 셀링포인트, 현장 이벤트, 바이어 어필 포인트, 출국 전 체크리스트를 만듭니다. 체험판에는 실행 전 화면을 담았습니다.'],
 ['기획','myfair','마이페어','준비 중인 박람회의 트렌드 분석·부스 컨셉 진행 상황과 보고서를 모아 봅니다.'],
 ['내 제품','products','내 제품 관리','분석 제품 1개를 고르면 시장·관세·트렌드·부스 컨셉 분석에 그대로 쓰입니다. 엑셀 양식으로 여러 제품을 한 번에 등록합니다.'],
 ['내 제품','product-add','제품 추가','제품명·HS코드(자동완성)·원재료·보유 인증·가격·강점을 입력합니다.'],
 ['바이어 관리','buyers','바이어 목록','박람회별 바이어와 메일 상태를 한 표에서 보고, 발송 후 오래 지난 바이어는 강조해 리마인드 시점을 알려 줍니다. 엑셀 일괄 등록을 지원합니다. 바이어는 가상 데이터입니다.'],
 ['바이어 관리','buyer-new','바이어 등록 · 명함 스캔','명함 사진을 찍거나 여러 장을 올리면 이름·회사·연락처를 자동으로 채웁니다.'],
 ['바이어 관리','template','메일 템플릿','당일 감사(D+0~1) → 팔로업(D+3~7) → 리마인드(D+14~21) 템플릿 3단계와 단계별 첨부 권장 자료를 관리합니다.'],
 ['바이어 관리','followup','바이어 개별 메일','템플릿의 이름·회사·박람회 자리가 바이어 정보로 자동으로 채워진 메일을 확인하고 Gmail로 보냅니다.'],
 ['바이어 관리','profile','발신 정보','메일 서명에 들어갈 이름·회사·직급과 AI 작성에 참고할 제품 설명을 저장합니다.'],
];
const nav=document.getElementById('nav'), view=document.getElementById('view');
let g='';
S.forEach(([grp,id,title])=>{
  if(grp!==g){g=grp;const h=document.createElement('h2');h.textContent=grp;nav.appendChild(h)}
  const b=document.createElement('button');b.type='button';b.dataset.id=id;
  b.innerHTML=`<span>${title}</span>`;
  b.addEventListener('click',()=>{location.hash=id});nav.appendChild(b);
});
function go(id){location.hash=id;view.scrollIntoView({block:'start'})}
function show(){
  let i=S.findIndex(s=>s[1]===location.hash.slice(1)); if(i<0)i=0;
  const [grp,sid,title,desc]=S[i];
  nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===sid)));
  const prev=S[(i-1+S.length)%S.length][1], next=S[(i+1)%S.length][1];
  view.innerHTML=`<div class="cap"><h3>${grp} · ${title}</h3>
    <div class="step"><span class="count">${i+1} / ${S.length}</span><button type="button" data-go="${prev}">← 이전</button><button type="button" data-go="${next}">다음 →</button></div>
    <p class="desc">${desc}</p></div>
    <div class="shot"><img src="img/${sid}.jpg" alt="${title} 화면" width="2160" height="${sid==='template'?1860:1350}"></div>
    <p class="note">실제 서비스 화면을 시연용 가상 데이터로 캡처했습니다. 이메일은 example.com 주소이고, 연락처·회사는 지어낸 정보입니다.</p>`;
  view.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
}
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea'))return;
  const i=Math.max(0,S.findIndex(s=>s[1]===location.hash.slice(1)));
  if(e.key==='ArrowRight')location.hash=S[(i+1)%S.length][1];
  if(e.key==='ArrowLeft')location.hash=S[(i-1+S.length)%S.length][1];
});
window.addEventListener('hashchange',show); show();
</script>

</body>
</html>
